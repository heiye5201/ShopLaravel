<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title description">
  <title id="title">Aurora Speaker</title>
  <desc id="description">A stylized portable speaker surrounded by an aurora glow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f2942"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#5eead4" stop-opacity=".7"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="420" rx="32" fill="url(#background)"/>
  <circle cx="360" cy="210" r="180" fill="url(#glow)"/>
  <rect x="240" y="88" width="240" height="244" rx="64" fill="#0b1728" stroke="#99f6e4" stroke-width="8"/>
  <circle cx="360" cy="210" r="76" fill="#17375e" stroke="#5eead4" stroke-width="10"/>
  <circle cx="360" cy="210" r="28" fill="#a7f3d0"/>
  <circle cx="323" cy="122" r="8" fill="#5eead4"/>
  <rect x="341" y="116" width="56" height="12" rx="6" fill="#31506e"/>
</svg>
